[package]
name = "proto-gfx-lua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exactly one script VM. The script language is not decided: Luau is the
# provisional default, the others exist to compare.
default = ["luau"]
luau = ["mlua/luau"]
lua55 = ["mlua/lua55", "mlua/vendored"]
luajit = ["mlua/luajit", "mlua/vendored"]

[dependencies]
proto-gfx-core.workspace = true
mlua.workspace = true

[build-dependencies]
proto-slangc.workspace = true

[dev-dependencies]
half.workspace = true
# The 3D example writes its shaders in Slang and can save its picture.
proto-slangc.workspace = true
png = "0.18"
rustix = { version = "1", features = ["time"] }
